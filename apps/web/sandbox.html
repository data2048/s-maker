<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>s-maker player</title>
  </head>
  <body>
    <div class="sb-toolbar">
      <button type="button" id="play" class="sb-btn primary" disabled>Loading…</button>
      <button type="button" id="stop" class="sb-btn" disabled>Stop</button>
      <span id="status" class="sb-status"></span>
      <span class="sb-spacer"></span>
      <span class="sb-hint">Ctrl+Enter play/update · Ctrl+. stop</span>
    </div>
    <div id="editor" class="sb-editor"></div>
    <div id="error" class="sb-error" hidden></div>
    <script type="module" src="/src/sandbox/main.ts"></script>
  </body>
</html>
